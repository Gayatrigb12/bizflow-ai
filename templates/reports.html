<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reports - BizFlow</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/config.js"></script>
    <script src="/static/api.js"></script>
    <script src="/static/auth.js"></script>
    <script src="/static/nav.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="logo">BizFlow <span>AI</span></div>
        <div class="model-badge">Reports</div>
        <button class="send-btn" onclick="logout()" style="margin-left:auto;">Logout</button>
      </header>

      <aside class="sidebar" id="appSidebar">
        <a class="nav-item" href="/dashboard" data-min-role="manager">Dashboard</a>
        <a class="nav-item" href="/chat">AI Chat <span class="nav-badge">AI</span></a>
        <a class="nav-item" href="/inventory">Inventory</a>
        <a class="nav-item" href="/orders">Orders</a>
        <a class="nav-item" href="/customers">Customers</a>
        <a class="nav-item active" href="/reports">Reports</a>
        <a class="nav-item" href="/approvals" data-min-role="manager">Approvals</a>
      </aside>

      <main class="main">
        <section class="panel active">
          <div class="panel-header">
            <h2>Reporting</h2>
            <div class="panel-sub">Download exports and review business performance.</div>
          </div>

          <div class="stats-grid" id="reportStats"></div>

          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px">
            <a class="send-btn" href="/api/export/inventory">Inventory CSV</a>
            <a class="send-btn" href="/api/export/customers">Customers CSV</a>
            <a class="send-btn" href="/api/export/orders">Orders CSV</a>
          </div>

          <div class="section-title" style="margin-top:8px">Best Sellers</div>
          <div id="bestSellers" class="inventory-grid"></div>

          <div class="section-title" style="margin-top:16px">Top Customers</div>
          <div id="topCustomers" class="customers-list"></div>
        </section>
      </main>
    </div>

    <div id="toastContainer" style="position:fixed;right:18px;bottom:18px;z-index:10000;display:flex;flex-direction:column;gap:8px"></div>
    <script src="/static/reports.js"></script>
  </body>
</html>
