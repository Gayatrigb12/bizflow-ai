<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BizFlow AI Login</title>
    <script src="/static/config.js"></script>
    <script src="/static/api.js"></script>
    <script src="/static/auth.js"></script>
    <script src="/static/login.js"></script>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #667eea 0%,
        #764ba2 50%,
        #6b73ff 100%
    );
    overflow:hidden;
}

/* Background Glow */
body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:rgba(255,255,255,0.08);
    border-radius:50%;
    top:-150px;
    left:-100px;
    filter:blur(80px);
}

body::after{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    background:rgba(255,255,255,0.08);
    border-radius:50%;
    bottom:-100px;
    right:-100px;
    filter:blur(80px);
}

.login-container{
    position:relative;
    z-index:1;
    width:420px;
}

.login-card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:24px;
    padding:40px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

.logo{
    text-align:center;
    margin-bottom:10px;
    font-size:48px;
}

.title{
    text-align:center;
    color:white;
    font-size:32px;
    font-weight:700;
}

.subtitle{
    text-align:center;
    color:rgba(255,255,255,0.8);
    margin-top:8px;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    color:white;
    margin-bottom:8px;
    font-size:14px;
}

.input-group input{
    width:100%;
    padding:14px 16px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,0.15);
    color:white;
    font-size:15px;
    outline:none;
    transition:0.3s;
}

.input-group input::placeholder{
    color:rgba(255,255,255,0.6);
}

.input-group input:focus{
    background:rgba(255,255,255,0.25);
    transform:translateY(-2px);
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:white;
    color:#5a4fcf;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(255,255,255,0.25);
}

#loginStatus{
    text-align:center;
    color:white;
    margin-top:18px;
    min-height:24px;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:rgba(255,255,255,0.75);
    font-size:13px;
}

@media(max-width:480px){
    .login-container{
        width:90%;
    }

    .login-card{
        padding:30px 25px;
    }
}
</style>
</head>

<body>

<div class="login-container">
    <div class="login-card">

        <div class="logo">🤖</div>

        <h1 class="title">BizFlow AI</h1>
        <p class="subtitle">Sign in to continue</p>

        <form id="loginForm">

            <div class="input-group">
                <label>Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Sign In
            </button>

        </form>

        <div id="loginStatus"></div>

        <div class="footer">
            © 2026 BizFlow AI Platform
        </div>

    </div>
</div>

</body>
</html>
